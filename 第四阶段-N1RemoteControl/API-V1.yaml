openapi: 3.0.3
info:
  title: N1RemoteControl API
  version: "1.1.0"
  description: |
    N1RemoteControl 0.4.1 远程接口：只读快照、SSE，以及音量、扫描、A/B 三项低风险控制。
    写请求必须经过鉴权并显式携带 confirm:true；同一时间只允许一个控制操作。
    本合同不包含 PTT、音频、频率/亚音/带宽、信道记录、固件或工厂操作。
    访问令牌不得通过 URL 查询串传递。
servers:
  - url: http://127.0.0.1:8710
    description: 默认回环地址；局域网或 Tailscale 地址由 N1 本地手动选择。
tags:
  - name: health
  - name: auth
  - name: monitor
  - name: control
paths:
  /healthz:
    get:
      tags: [health]
      summary: 最小健康检查
      security: []
      responses:
        "200":
          description: 进程正在运行；电台离线也会返回 200。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
  /login:
    get:
      tags: [auth]
      summary: 内置访问令牌登录页
      security: []
      responses:
        "200":
          description: 登录页面
          content:
            text/html:
              schema:
                type: string
  /api/v1/session:
    post:
      tags: [auth]
      summary: 使用访问令牌建立 HttpOnly 会话
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  description: N1 本地生成的访问令牌。
                  minLength: 10
                  maxLength: 256
      responses:
        "303":
          description: 登录成功，设置 Cookie 并跳转到首页。
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Strict; Path=/; Max-Age=43200
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/AuthFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [auth]
      summary: 退出当前浏览器会话
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 会话已清除，Cookie 已过期。
        "401":
          $ref: "#/components/responses/AuthRequired"
  /:
    get:
      tags: [monitor]
      summary: 只读状态页
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 状态与控制页面；只提供音量、扫描和 A/B 三项低风险控制，不包含发射或音频控件。
          content:
            text/html:
              schema:
                type: string
        "303":
          description: 无有效会话时跳转到 /login。
        "401":
          $ref: "#/components/responses/AuthRequired"
  /assets/app.js:
    get:
      tags: [monitor]
      summary: 内置页面脚本
      security: []
      responses:
        "200":
          description: 本地 JavaScript，不加载外部脚本；只有三项受限控制接口。
          content:
            application/javascript:
              schema:
                type: string
  /assets/style.css:
    get:
      tags: [monitor]
      summary: 内置页面样式
      security: []
      responses:
        "200":
          description: 本地 CSS，不加载外部资源。
          content:
            text/css:
              schema:
                type: string
  /api/v1/snapshot:
    get:
      tags: [monitor]
      summary: 获取只读快照
      description: |
        快照只能反映最近一次成功读取或通知。
        已有最后已知快照时，即使连接断开或超过 staleAfterMs 也返回 200，并将 stale 设为 true。
        未读取成功的数据字段必须为 null；从未成功读取过快照且电台离线时才返回 503。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: 当前只读快照；电台离线时仍可返回最后已知快照，并通过 stale=true 标记过期。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 服务从未成功读取过快照且电台离线；已有缓存快照时不得使用此响应。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events:
    get:
      tags: [monitor]
      summary: Server-Sent Events 摘要流
      description: |
        事件只包含 instanceId、revision、updatedAt、stale 和心跳。
        完整状态由客户端重新拉取 /api/v1/snapshot。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: SSE 长连接
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Connection:
              schema:
                type: string
                example: keep-alive
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: ready
                  id: gw-7f3c2a91:42
                  data: {"instanceId":"gw-7f3c2a91","revision":42}

                  event: heartbeat
                  data: {"at":"2026-11-27T14:25:18Z"}
        "401":
          $ref: "#/components/responses/AuthRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/control:
    get:
      tags: [control]
      summary: 获取当前低风险控制状态
      description: |
        可随时轮询。IDLE 表示没有活动操作；busy=true 表示一个操作仍在执行。
        sent 表示目标写命令已经发出；rollbackSent 表示自动恢复写命令已经发出。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: 当前控制状态，包含最近一次操作的基线与回读结果。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlStatus"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 电台控制会话尚未启动。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/control/volume:
    post:
      tags: [control]
      summary: 设置音量（0..15）
      description: |
        服务立即返回 202，后台依次执行基线读取、一次目标写入和一次延迟回读。
        客户端应轮询 /api/v1/control，直到 state 为终态。不得自动重复提交写请求。
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlVolumeRequest"
      responses:
        "202":
          description: 操作已接受并开始执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "400":
          description: JSON 无效、缺少 confirm:true 或音量超出 0..15。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: 已有一个控制操作在执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: 控制请求必须使用 application/json。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 电台尚未就绪或控制调度器不可用。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ControlSubmission"
                  - $ref: "#/components/schemas/Error"
  /api/v1/control/scan:
    post:
      tags: [control]
      summary: 设置扫描开关
      description: |
        先读取完整原始设置块，仅修改扫描位，再写入完整设置块。
        一次请求只发一次目标写；回读不一致时最多发起一次原值回滚。
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlScanRequest"
      responses:
        "202":
          description: 操作已接受并开始执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "400":
          description: JSON 无效、缺少 confirm:true 或 scan 不是布尔值。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: 已有一个控制操作在执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: 控制请求必须使用 application/json。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 电台尚未就绪或控制调度器不可用。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ControlSubmission"
                  - $ref: "#/components/schemas/Error"
  /api/v1/control/side:
    post:
      tags: [control]
      summary: 切换当前 A/B 信道侧
      description: |
        先读取完整原始设置块，仅修改当前侧，再写入完整设置块。
        一次请求只发一次目标写；回读不一致时最多发起一次原值回滚。
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlSideRequest"
      responses:
        "202":
          description: 操作已接受并开始执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "400":
          description: JSON 无效、缺少 confirm:true 或 side 不是 A/B。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: 已有一个控制操作在执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSubmission"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: 控制请求必须使用 application/json。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 电台尚未就绪或控制调度器不可用。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ControlSubmission"
                  - $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: n75_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 10-character-token
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok, service, version]
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: N1RemoteControl
        version:
          type: string
          example: 0.4.1
    Error:
      type: object
      additionalProperties: false
      required: [ok, code, message, requestId]
      properties:
        ok:
          type: boolean
          example: false
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - AUTH_FAILED
            - SESSION_EXPIRED
            - RATE_LIMITED
            - RADIO_OFFLINE
            - METHOD_NOT_ALLOWED
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - TOO_MANY_CLIENTS
            - INTERNAL_ERROR
            - BAD_REQUEST
            - BAD_JSON
            - CONFIRMATION_REQUIRED
            - UNSUPPORTED_MEDIA_TYPE
            - VOLUME_OUT_OF_RANGE
            - SCAN_OUT_OF_RANGE
            - SIDE_OUT_OF_RANGE
            - RADIO_NOT_READY
        message:
          type: string
        requestId:
          type: string
          example: req-7a18c2
    ControlVolumeRequest:
      type: object
      additionalProperties: false
      required: [volume, confirm]
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 15
          example: 4
        confirm:
          type: boolean
          enum: [true]
          description: 必须显式确认此次写入。
    ControlScanRequest:
      type: object
      additionalProperties: false
      required: [scan, confirm]
      properties:
        scan:
          type: boolean
          example: true
        confirm:
          type: boolean
          enum: [true]
          description: 必须显式确认此次写入。
    ControlSideRequest:
      type: object
      additionalProperties: false
      required: [side, confirm]
      properties:
        side:
          type: string
          enum: [A, B]
          example: B
        confirm:
          type: boolean
          enum: [true]
          description: 必须显式确认此次写入。
    ControlSubmission:
      type: object
      additionalProperties: false
      required: [ok, accepted, code, operationId, state, action]
      properties:
        ok:
          type: boolean
          example: true
        accepted:
          type: boolean
          example: true
        code:
          type: string
          enum:
            - CONTROL_ACCEPTED
            - CONTROL_BUSY
            - RADIO_NOT_READY
            - CONTROL_TIMER_UNAVAILABLE
            - CONTROL_CALLBACK_UNAVAILABLE
        operationId:
          type: string
          nullable: true
          example: ctl-1
        state:
          type: string
          enum:
            - ACCEPTED
            - BASELINE_READ
            - WRITING
            - READBACK
            - READBACK_OK
            - READBACK_MISMATCH
            - ROLLBACK_WRITING
            - ROLLBACK_OK
            - ROLLBACK_FAILED
            - TIMEOUT
            - BUSY
            - UNAVAILABLE
            - LINK_LOST
            - CANCELLED
        action:
          type: string
          enum: [volume, scan, side]
    ControlStatus:
      type: object
      additionalProperties: false
      required: [ok, available, busy, state, kind, operationId, target, baselineDisplay, expectedDisplay, observedDisplay, reason, updatedAt, epoch, sent, rollbackSent]
      properties:
        ok:
          type: boolean
          example: true
        available:
          type: boolean
          description: 电台控制会话当前是否可用。
        busy:
          type: boolean
          description: 是否有一个尚未结束的控制操作。
        state:
          type: string
          enum:
            - IDLE
            - ACCEPTED
            - BASELINE_READ
            - WRITING
            - READBACK
            - READBACK_OK
            - READBACK_MISMATCH
            - ROLLBACK_WRITING
            - ROLLBACK_OK
            - ROLLBACK_FAILED
            - TIMEOUT
            - BUSY
            - UNAVAILABLE
            - LINK_LOST
            - CANCELLED
        kind:
          type: string
          nullable: true
          enum: [VOLUME, SCAN, SIDE]
        operationId:
          type: string
          nullable: true
          example: ctl-1
        target:
          type: string
          nullable: true
          description: 目标值的简短文本，例如 4、ON、OFF、A 或 B。
        baselineDisplay:
          type: string
          nullable: true
          description: 写入前读取的原始值。
        expectedDisplay:
          type: string
          nullable: true
          description: 写入后应回读到的目标值。
        observedDisplay:
          type: string
          nullable: true
          description: 最近一次实际回读值。
        reason:
          type: string
          nullable: true
          description: 稳定的内部原因码，不包含令牌或原始链路数据。
        updatedAt:
          type: string
          format: date-time
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: 蓝牙链路实例编号；断链变化后旧操作不得继续写入。
        sent:
          type: boolean
          description: 目标写命令是否已经发出。
        rollbackSent:
          type: boolean
          description: 自动恢复写命令是否已经发出。
    Gateway:
      type: object
      additionalProperties: false
      required: [state, version, startedAt, lastErrorCode]
      properties:
        state:
          type: string
          enum: [STOPPED, STARTING, CONNECTING_BLUETOOTH, ONLINE, DEGRADED, RECONNECTING, FAULT]
        version:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
    Connection:
      type: object
      additionalProperties: false
      required: [state, deviceLabel, connectedAt, lastError]
      properties:
        state:
          type: string
          enum: [DISCONNECTED, CONNECTING, CONNECTED, RECONNECTING, FAULT]
        deviceLabel:
          type: string
          nullable: true
          description: 仅设备名称或短标签，不返回蓝牙 MAC。
        connectedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
    Capabilities:
      type: object
      additionalProperties: false
      required: [fmReceive, dmr, vfo]
      properties:
        fmReceive:
          type: boolean
        dmr:
          type: boolean
        vfo:
          type: boolean
    Settings:
      type: object
      additionalProperties: false
      required: [channelA, channelB, currentSide, scan, squelch, dualMode]
      properties:
        channelA:
          type: integer
          nullable: true
          minimum: 0
        channelB:
          type: integer
          nullable: true
          minimum: 0
        currentSide:
          type: string
          nullable: true
          enum: [A, B, null]
        scan:
          type: boolean
          nullable: true
        squelch:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
        dualMode:
          type: string
          nullable: true
          enum: [A, B, null]
    RadioStatus:
      type: object
      additionalProperties: false
      required: [power, transmitting, squelchOpen, receiving, scanning, fmBroadcast, currentChannel, currentZone, rssiLevel]
      properties:
        power:
          type: boolean
          nullable: true
        transmitting:
          type: boolean
          nullable: true
        squelchOpen:
          type: boolean
          nullable: true
        receiving:
          type: boolean
          nullable: true
        scanning:
          type: boolean
          nullable: true
        fmBroadcast:
          type: boolean
          nullable: true
        currentChannel:
          type: integer
          nullable: true
          minimum: 0
        currentZone:
          type: integer
          nullable: true
          minimum: 0
        rssiLevel:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
    Radio:
      type: object
      additionalProperties: false
      required: [productId, softwareVersion, channelCount, zoneCount, bandCount, capabilities, settings, status]
      properties:
        productId:
          type: string
          nullable: true
        softwareVersion:
          type: string
          nullable: true
        channelCount:
          type: integer
          nullable: true
        zoneCount:
          type: integer
          nullable: true
        bandCount:
          type: integer
          nullable: true
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        settings:
          $ref: "#/components/schemas/Settings"
        status:
          $ref: "#/components/schemas/RadioStatus"
    Channel:
      type: object
      additionalProperties: false
      required: [id, name, rxMHz, txMHz]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        rxMHz:
          type: number
          format: double
          nullable: true
        txMHz:
          type: number
          format: double
          nullable: true
    Snapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, ok, instanceId, revision, generatedAt, updatedAt, staleAfterMs, stale, source, gateway, connection, radio, volume, channel]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        ok:
          type: boolean
          example: true
        instanceId:
          type: string
          description: 服务每次启动生成的新实例标识。
        revision:
          type: integer
          format: int64
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        staleAfterMs:
          type: integer
          example: 15000
        stale:
          type: boolean
        source:
          type: string
          enum: [none, initial, poll, notification]
        gateway:
          $ref: "#/components/schemas/Gateway"
        connection:
          $ref: "#/components/schemas/Connection"
        radio:
          $ref: "#/components/schemas/Radio"
        volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"
  responses:
    AuthRequired:
      description: 需要有效访问令牌或会话。
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthFailed:
      description: 访问令牌或会话无效；不区分具体失败原因。
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: 连续鉴权失败或客户端数量超过限制。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 请求体超过 1024 字节。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 服务内部错误；不返回栈或敏感信息。
      content:
